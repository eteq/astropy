language: python
python:
 - 2.7
 - 2.6
 - 3.2
 - 3.1
env:
 - NUMPY_VERSION=999.9 #this guarantees the latest version
 - NUMPY_VERSION=1.5.1
 - NUMPY_VERSION=1.4.1
before_install:
 #we do this to make sure we get the dependencies so pip works below
 - sudo apt-get update -qq
 - sudo apt-get install -qq python-numpy python-scipy cython libatlas-dev liblapack-dev gfortran
install: 
 - pip -q install "numpy<=$NUMPY_VERSION" --use-mirrors
 - pip -q install Cython --use-mirrors
 #skip scipy for now due to long build time
 #- pip -q install scipy --use-mirrors
 - python setup.py build
script:  python setup.py test
